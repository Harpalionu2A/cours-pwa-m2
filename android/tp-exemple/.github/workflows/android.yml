      #     FIREBASE_SERVICE_CREDENTIALS_B64: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS_B64 }}
      #   run: |
      #     echo "$FIREBASE_SERVICE_CREDENTIALS_B64" | base64 -d > firebase-sa.json
      #     FIREBASE_SERVICE_CREDENTIALS=$PWD/firebase-sa.json ./gradlew appDistributionUploadRelease --no-daemon
